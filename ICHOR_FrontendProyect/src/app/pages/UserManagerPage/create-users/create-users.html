
<app-header />

<div class="flex flex-col justify-center items-center bg-base-100 p-4">

  <h1 class="text-2xl font-bold mb-6 text-primary">Create User</h1>

  <div class="w-full max-w-xs">

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">

      <div *ngIf="errorMessage" class="alert alert-error shadow-sm mb-2 text-sm p-3 flex flex-row items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <label for="username" class="font-semibold text-sm">Username</label>
      <input
        type="text"
        formControlName="username"
        id="username"
        class="input input-primary w-full"
        [class.input-error]="userForm.get('username')?.invalid && userForm.get('username')?.touched"
        placeholder="Username">

      <span *ngIf="userForm.get('username')?.errors?.['pattern'] && userForm.get('username')?.touched" class="text-xs text-error font-medium px-1">
        Must be between 10 and 50 characters long.
      </span>


      <label for="password" class="font-semibold text-sm mt-1">Password</label>
      <input
        type="password"
        formControlName="password"
        id="password"
        class="input input-primary w-full"
        [class.input-error]="userForm.get('password')?.invalid && userForm.get('password')?.touched"
        placeholder="Password">

      <span *ngIf="userForm.get('password')?.errors?.['pattern'] && userForm.get('password')?.touched" class="text-xs text-error font-medium px-1 leading-tight">
        Required: 8-127 chars, 1 letter, 1 number, and 1 special char (@$!%*#?&).
      </span>


      <label for="hospitals" class="font-semibold text-sm mt-1">Hospital</label>
      <select
        formControlName="hospitals"
        id="hospitals"
        class="select select-primary w-full font-normal">
        <option value="" disabled selected>Select a hospital...</option>
        <option *ngFor="let hosp of createUserService.hospitals()" [value]="hosp.id">
          {{ hosp.name }}
        </option>
      </select>


      <label class="font-semibold text-sm mt-2">Role</label>
      <div class="flex gap-6 pl-1 mb-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input
            type="radio"
            formControlName="role"
            value="doctor"
            class="radio radio-primary radio-sm" />
          <span class="text-sm">Doctor</span>
        </label>

        <label class="flex items-center gap-2 cursor-pointer">
          <input
            type="radio"
            formControlName="role"
            value="coordinators"
            class="radio radio-primary radio-sm" />
          <span class="text-sm">Coordinator</span>
        </label>
      </div>


      <div class="flex gap-2 w-full mt-2">
        <button
          type="button"
          (click)="onCancel()"
          class="btn btn-outline btn-error flex-1">
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary flex-1"
          [disabled]="userForm.invalid">
          Create User
        </button>
      </div>

    </form>
  </div>
</div>
