<div class="flex flex-col items-center min-h-screen bg-base-200 p-6">

  <div class="w-full max-w-4xl flex flex-col gap-6">

    <h1 class="text-3xl font-bold text-primary text-center">Panel de Control - Doctor</h1>

    <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
      <input
        type="text"
        [(ngModel)]="searchBar"
        placeholder="Buscar por nombre o DNI..."
        class="input input-primary w-full sm:max-w-md">

      <button (click)="goToCreatePatient()" class="btn btn-primary w-full sm:w-auto">
        + Registrar Nuevo Paciente
      </button>
    </div>

    <div class="overflow-x-auto bg-base-100 rounded-lg shadow-sm border border-base-300">
      <table class="table w-full">
        <thead>
          <tr class="bg-base-300">
            <th>Full Name</th>
            <th>DNI</th>
            <th>Blood Type</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let patient of filteredPatients"
            (click)="selectPatient(patient)"
            class="hover:bg-primary/10 cursor-pointer transition-colors">
            <td class="font-medium">{{ patient.fullname }}</td>
            <td>{{ patient.dni }}</td>
            <td>
              <span class="badge badge-ghost font-bold text-error">{{ patient.bloodType }}</span>
            </td>
          </tr>
          <tr *ngIf="filteredPatients.length === 0">
            <td colspan="3" class="text-center text-base-400 py-4">Patients not found.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="patientSelected" class="p-4 bg-base-100 rounded-lg border-l-4 border-primary shadow-sm flex flex-col gap-2">
      <div class="flex justify-between items-center border-b border-base-300 pb-2">
        <h3 class="text-lg font-bold text-primary">Patient</h3>
        <button (click)="patientSelected = null" class="btn btn-xs btn-circle btn-ghost">✕</button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-2 text-sm">
        <div><span class="font-semibold text-base-content/70">Full name:</span> {{ patientSelected?.fullname }}</div>
        <div><span class="font-semibold text-base-content/70">DNI:</span> {{ patientSelected?.dni }}</div>
        <div><span class="font-semibold text-base-content/70">BloodType:</span> <span class="text-error font-bold">{{ patientSelected?.bloodType }}</span></div>
      </div>
    </div>

  </div>

</div>
