<div class="flex min-h-screen items-center justify-center bg-base-300">

  <form [formGroup]="myForm" (ngSubmit)="onSubmit()"
  class="card w-full max-w-sm bg-base-100 shadow-xl">

  <h2 class="card-title justify-center text-2xl font-black tracking-wider text-center mb-2">Log In</h2>
    <div>

        @if(errMessage() != ''){
      <div>
        <br>
        <label class="text-red-700 text-xl">{{ errMessage() }}</label>

      </div>
      }

      <label for="usernameInput" class="fieldset-label">Username</label>
      <input
        id="usernameInput"
        type="text"
        class="input input-primary"
        placeholder="Username"
        formControlName="name">

        <br>

        @if(  formUtils.isValidField(myForm, 'name') ){
          <span class="text-field text-orange-500">
            {{ formUtils.getFieldError(myForm, 'name') }}
          </span>
        }

      <br>
      <br>

      <label for="passwordInput" class="label fieldset-label">Password</label>
      <input
        type="password"
        id="passwordInput"
        class="input input-primary"
        placeholder="Password"
        formControlName="password">

        <br>

        @if(  formUtils.isValidField(myForm, 'password') ){
          <span class="text-field text-orange-500">
            {{ formUtils.getFieldError(myForm, 'password') }}
          </span>
        }

      <br>
      <br>
      <button
        class="btn btn-primary"
        >Log in</button>
    </div>

  </form>

</div>
