<div class="flex h-100 items-center justify-center">

  <div class="w-1/3">

    <label for="usernameInput" class="fieldset-label">Username</label>
    <input
      #nameInput
      id="usernameInput"
      type="text"
      class="input input-primary"
      placeholder="Username"
      [value]="name()"
      (input)="name.set(nameInput.value)"
      (change)="name.set(nameInput.value)">

    <br>
    <br>

    <label for="passwordInput" class="label fieldset-label">Password</label>
    <input
      #passInput
      type="password"
      id="passwordInput"
      class="input input-primary"
      placeholder="Password"
      [value]="pass()"
      (input)="pass.set(passInput.value)"
      (change)="pass.set(passInput.value)">

    <br>
    <br>
    <button
      class="btn btn-primary"
      (click)="logUser()">Log in</button>
  </div>
</div>
