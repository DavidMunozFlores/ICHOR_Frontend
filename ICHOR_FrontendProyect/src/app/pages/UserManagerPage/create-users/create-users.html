<div class="flex flex-col justify-center items-center min-h-screen bg-base-200 p-4">

  <h1 class="text-2xl font-bold mb-6 text-primary">Create User</h1>

  <div class="w-full max-w-xs">

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">

      <label for="username" class="font-semibold text-sm">Username</label>
      <input
        type="text"
        formControlName="username"
        id="username"
        class="input input-primary w-full"
        placeholder="Username">

      <label for="password" class="font-semibold text-sm">Password</label>
      <input
        type="password"
        formControlName="password"
        id="password"
        class="input input-primary w-full"
        placeholder="Password">

      <label for="hospitals" class="font-semibold text-sm">Hospital</label>
      <select
        formControlName="hospitals"
        id="hospitals"
        class="select select-primary w-full font-normal">
        <option value="" disabled selected>Select a hospital...</option>
        <option *ngFor="let hosp of hospitals" [value]="hosp.id">
          {{ hosp.name }}
        </option>
      </select>

      <label class="font-semibold text-sm mt-2">Role</label>
      <div class="flex gap-6 pl-1 mb-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input
            type="radio"
            formControlName="role"
            value="doctor"
            class="radio radio-primary radio-sm" />
          <span class="text-sm">Doctor</span>
        </label>

        <label class="flex items-center gap-2 cursor-pointer">
          <input
            type="radio"
            formControlName="role"
            value="coordinators"
            class="radio radio-primary radio-sm" />
          <span class="text-sm">Coordinator</span>
        </label>
      </div>

      <div class="flex gap-2 w-full mt-2">
        <button
          type="button"
          (click)="onCancel()"
          class="btn btn-outline btn-error flex-1">
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary flex-1">
          Create User
        </button>
      </div>

    </form>
  </div>
</div>
