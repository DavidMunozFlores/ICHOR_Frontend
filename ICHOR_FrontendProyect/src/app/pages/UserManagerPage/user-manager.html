<app-header />
<div class="fixed top-4 right-4 z-50" *ngIf="toastMessage">
  <div class="alert alert-success shadow-lg">
    <span>{{ toastMessage }}</span>
  </div>
</div>
<div class="flex flex-col items-center min-h-screen bg-base-200 p-6">

  <div class="w-full max-w-4xl flex flex-col gap-6">

    <h1 class="text-3xl font-bold text-primary text-center">User manager page</h1>

    <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
      <input
        type="text"
        [(ngModel)]="searchBar"
        placeholder="Search by name, hospital or role..."
        class="input input-primary w-full sm:max-w-md">

      <button (click)="redirectToCreate()" class="btn btn-primary w-full sm:w-auto">
        + Add New Employee
      </button>
    </div>

    <div class="overflow-x-auto bg-base-100 rounded-lg shadow-sm border border-base-300">
      <table class="table w-full">
        <thead>
          <tr class="bg-base-300">
            <th>Name</th>
            <th>Hospital</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let employee of filteredEmployees" class="hover:bg-base-200 transition-colors">
            <td class="font-medium">{{ employee.username }}</td>
            <td>{{ employee.hospitalId }}</td>
            <td>
  <span class="badge badge-ghost font-medium">
    {{ employee.role }}
  </span>
</td>
          </tr>

          <tr *ngIf="filteredEmployees.length === 0">
            <td colspan="3" class="text-center text-base-400 py-4">No employees found.</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</div>
